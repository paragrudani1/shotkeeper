# XcodeGen spec for the macOS app. Generate with: xcodegen generate --spec App/project.yml
# The generated App/Shotkeeper.xcodeproj is gitignored; never commit it.
name: Shotkeeper
options:
  bundleIdPrefix: dev.shotkeeper
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc / unsigned: no team, no certificate. CI additionally passes CODE_SIGNING_ALLOWED=NO.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES

packages:
  # The Swift package at the repository root (path is relative to this spec).
  Shotkeeper:
    path: ..
  # The one third-party dependency (Parag, 2026-11-28; docs/wiki/architecture.md). App target only: the root
  # Package.swift (core, CLI, Linux) never depends on it. Pinned exactly; upgrading is its own PR with the real-Mac
  # checks (auto-update spec, "Dependency"). Only Coordinator/UpdateChecks.swift imports it (lint rule sparkle-import).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  Shotkeeper:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shotkeeper
    dependencies:
      - package: Shotkeeper
        product: ShotkeeperCore
      - package: Sparkle
    info:
      path: Shotkeeper/Info.plist
      properties:
        CFBundleDisplayName: Shotkeeper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu-bar only: no Dock icon, no main menu.
        LSUIElement: true
        NSHumanReadableCopyright: ""
        # Sparkle (auto-update spec, "Info.plist keys"; Sparkle "Customizing Sparkle",
        # https://sparkle-project.org/documentation/customization/ ). Checks are manual only (Parag, 2026-11-28).
        # scripts/check-app-plist.sh checks the built app in CI. SUPublicEDKey comes with ticket 08 (Parag's key).
        SUFeedURL: https://github.com/paragrudani1/shotkeeper/releases/latest/download/appcast.xml
        # NO: no automatic checks by default, and no "check automatically?" question (asked only while unset).
        SUEnableAutomaticChecks: false
        # Default NO already; explicit.
        SUAutomaticallyUpdate: false
        # NO: "disallow automatic updates and require manual installation every time"; the update window then
        # hides its "Automatically download and install updates" checkbox (Sparkle 2.10.1 SUUpdateAlert.m).
        SUAllowsAutomaticUpdates: false
        # Check the EdDSA signature before extracting the update ("EdDSA signing is required to use this setting").
        # With it on and no SUPublicEDKey, Sparkle 2.10.1 refuses to start (SPUUpdater.m, startUpdater:), so this
        # branch is not released before ticket 08 adds the key.
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shotkeeper.Shotkeeper
        PRODUCT_NAME: Shotkeeper
        # Not sandboxed: the app watches arbitrary folders and launches a local Python model server.
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        # Both Shotkeeper/AppIcon.icon (Icon Composer, macOS 26) and Shotkeeper/Assets.xcassets/AppIcon.appiconset
        # are named AppIcon; both are generated by scripts/make-icons.sh from core IconGeometry. XcodeGen >= 2.45.1
        # adds the .icon as one resource. actool writes AppIcon.icns + Assets.car and adds CFBundleIconFile/
        # CFBundleIconName to Info.plist. Which one shows on which macOS: docs/research/icon-composer.md.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ShotkeeperAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ShotkeeperAppTests
    dependencies:
      - target: Shotkeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shotkeeper.ShotkeeperAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Shotkeeper.app/Contents/MacOS/Shotkeeper
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Shotkeeper:
    build:
      targets:
        Shotkeeper: all
        ShotkeeperAppTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ShotkeeperAppTests
    run:
      config: Debug
    archive:
      config: Release
