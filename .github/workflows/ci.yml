name: CI

# Triggers (2026-11-28): every PR push used to run the whole workflow twice (push + pull_request), and docs-only
# commits queued the slow macOS job. PR branches now run once, via pull_request; pushes run only on main and the
# integration branches (merges land there). Changes that touch only docs/ or Markdown skip CI.
on:
  push:
    branches: [main, 't3/wave*', 't3/auto-update', 't3/clean-up']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: linux-core (Swift 6.4.3)
    runs-on: ubuntu-latest
    container: swift:6.4.3-noble
    timeout-minutes: 30
    steps:
      - name: Install libsqlite3-dev
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/checkout@v5

      - name: Lint on Linux (bash 5, GNU grep/sed)
        run: |
          scripts/lint.sh --self-test
          scripts/lint.sh

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: linux-swift-6.4.3-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: linux-swift-6.4.3-

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

  macos-app:
    name: macos-app
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
    steps:
      - uses: actions/checkout@v5

      # lint.sh is written for macOS's own bash 3.2 and BSD grep/sed; this is the step that proves it (2026-11-28).
      - name: Lint on macOS (bash 3.2, BSD grep/sed)
        run: |
          /bin/bash --version | head -1
          /bin/bash scripts/lint.sh --self-test
          /bin/bash scripts/lint.sh

      - name: Select newest stable Xcode
        id: xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_RC|Release_Candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          sw_vers
          echo "version=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: macos-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: macos-xcode${{ steps.xcode.outputs.version }}-

      - name: swift test (package)
        run: swift test

      - name: Vision measurement tool (type-check and sample run)
        run: |
          set -euo pipefail
          # Ticket 05: scripts/measure-vision.swift is macOS only and outside the package and the app.
          # docs/research/vision-ocr-settings.md. Type-check it, then run it the way Parag will, on generated images.
          xcrun swiftc -typecheck scripts/measure-vision.swift
          SAMPLE="$RUNNER_TEMP/vision-sample"
          xcrun swift scripts/measure-vision.swift --make-sample "$SAMPLE"
          xcrun swift scripts/measure-vision.swift "$SAMPLE" --check

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec App/project.yml

      - name: xcodebuild build (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/Shotkeeper.xcodeproj -scheme Shotkeeper -configuration Release \
            -destination 'platform=macOS' -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

      - name: xcodebuild test (Debug)
        env:
          # xcodebuild passes TEST_RUNNER_* to the test process without the prefix; UISnapshotTests writes the PNGs
          # there (fallback /tmp/shotkeeper-ui-snapshots). See docs/wiki/macos-ci.md, "UI snapshots".
          TEST_RUNNER_SHOTKEEPER_SNAPSHOT_DIR: ${{ github.workspace }}/build/ui-snapshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project App/Shotkeeper.xcodeproj -scheme Shotkeeper -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

      - name: Collect UI snapshots
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build/ui-snapshots"
          mkdir -p "$OUT"
          if ! ls "$OUT"/*.png >/dev/null 2>&1 && ls /tmp/shotkeeper-ui-snapshots/*.png >/dev/null 2>&1; then
            echo "TEST_RUNNER_ env did not reach the test host; using the /tmp fallback"
            cp /tmp/shotkeeper-ui-snapshots/*.png "$OUT"/
          fi
          ls -l "$OUT"

      - name: Check the app icon in the bundle
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # PR 4: AppIcon.appiconset (scripts/make-icons.sh) must reach the Release app as AppIcon.icns + Assets.car.
          APP="$DERIVED_DATA/Build/Products/Release/Shotkeeper.app"
          ls -l "$APP/Contents/Resources"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' -c 'Print :CFBundleIconName' "$APP/Contents/Info.plist"
          test -s "$APP/Contents/Resources/Assets.car"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"
          iconutil -c iconset -o "$ICONSET" "$APP/Contents/Resources/AppIcon.icns"
          ls -l "$ICONSET"
          # Next to the UI snapshots, so the artifact shows what the Dock and Finder get.
          OUT="$GITHUB_WORKSPACE/build/ui-snapshots"
          mkdir -p "$OUT"
          for f in "$ICONSET"/*.png; do cp "$f" "$OUT/bundle-$(basename "$f")"; done

      - name: Compile the Icon Composer icon (actool)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # PR 4: App/Shotkeeper/AppIcon.icon (macOS 26 layered icon, scripts/make-icons.sh) next to the AppIcon
          # appiconset. docs/research/icon-composer.md. Fails on any actool warning or error in the "built" case,
          # which compiles the same inputs as the app target.
          xcodegen --version
          xcrun actool --version
          echo "--- project file references to AppIcon.icon (expect one file in Resources, no icon.json/SVG entries):"
          grep -n "AppIcon.icon\|icon.json\|1-corners.svg" App/Shotkeeper.xcodeproj/project.pbxproj || true
          OUT="$GITHUB_WORKSPACE/build/ui-snapshots"
          mkdir -p "$OUT"
          compile() {
            local name="$1"; shift
            local dir="$RUNNER_TEMP/actool-$name"
            mkdir -p "$dir"
            echo "=== actool: $name"
            xcrun actool "$@" --compile "$dir" --output-format human-readable-text --notices --warnings --errors \
              --output-partial-info-plist "$dir/partial-info.plist" --app-icon AppIcon --target-device mac \
              --minimum-deployment-target 15.0 --platform macosx 2>&1 | tee "$dir/actool.log"
            ls -l "$dir"
            [ -f "$dir/partial-info.plist" ] && plutil -p "$dir/partial-info.plist"
            if [ -f "$dir/AppIcon.icns" ]; then
              iconutil -c iconset -o "$dir/AppIcon.iconset" "$dir/AppIcon.icns"
              for f in "$dir/AppIcon.iconset"/*.png; do cp "$f" "$OUT/actool-$name-$(basename "$f")"; done
            fi
            [ -f "$dir/Assets.car" ] && xcrun assetutil --info "$dir/Assets.car" \
              | grep -E '"(AssetType|Name|RenditionName|Appearance|PixelWidth|Idiom)"' | sort | uniq -c | head -60 || true
          }
          # Absolute paths, as Xcode passes them: actool can hand the call to an ibtoold server that xcodebuild
          # left running with cwd App/, which resolves relative paths against its own cwd (App/App/...). See
          # docs/wiki/macos-ci.md, 2026-11-28.
          ICON="$GITHUB_WORKSPACE/App/Shotkeeper/AppIcon.icon"
          XCASSETS="$GITHUB_WORKSPACE/App/Shotkeeper/Assets.xcassets"
          # Informational: the .icon alone, and with the (undocumented) flag that stops actool from generating
          # the pre-26 fallback images from the .icon.
          compile icon-only "$ICON" || true
          compile no-fallback-generation "$ICON" "$XCASSETS" --enable-icon-stack-fallback-generation=disabled || true
          # The app target's inputs, as Xcode passes them. This one must be clean.
          compile built "$ICON" "$XCASSETS"
          if grep -qiE 'warning|error' "$RUNNER_TEMP/actool-built/actool.log"; then
            echo "::error::actool reported warnings or errors for AppIcon.icon + Assets.xcassets"
            exit 1
          fi
          test -s "$RUNNER_TEMP/actool-built/Assets.car"

      - name: Upload UI snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Shotkeeper-ui-snapshots
          path: build/ui-snapshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Ad-hoc sign and zip the app
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release/Shotkeeper.app"
          # Built with CODE_SIGNING_ALLOWED=NO; an ad-hoc seal (no identity) keeps the bundle launchable on
          # Apple silicon after the user clears quarantine. Not notarized.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          mkdir -p build/artifacts
          ditto -c -k --keepParent "$APP" build/artifacts/Shotkeeper-unsigned.zip
          ls -lh build/artifacts

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Shotkeeper-unsigned
          path: build/artifacts/Shotkeeper-unsigned.zip
          if-no-files-found: error
          retention-days: 14
